name: Playwright Tests

on:
  schedule:
    - cron: '30 21 * * 1-5'  # Mon-Fri 8PM IST

  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      environment:
        description: 'Select environment'
        required: true
        default: 'QA'
        type: choice
        options:
          - QA
          - stage
          - dev

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event.inputs.environment || 'QA' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps only (if cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # reportingLabs run history: powers the Trend chart, new vs known
      # failures, flaky dots and "got slower". One history per environment.
      - name: Restore reportingLabs history
        uses: actions/cache@v4
        with:
          path: reporting-labs.history.json
          key: reporting-labs-history-${{ github.event.inputs.environment || 'QA' }}-${{ github.run_id }}
          restore-keys: reporting-labs-history-${{ github.event.inputs.environment || 'QA' }}-

      # Check whether GitHub Actions is receiving the required secrets.
      # This does NOT print the actual secret values.
      - name: Check environment variables
        run: |
          echo "ENV=$ENV"

          if [ -n "$BASEURL" ]; then
            echo "BASEURL is set"
          else
            echo "BASEURL is EMPTY"
          fi

          if [ -n "$API_BASE_URL" ]; then
            echo "API_BASE_URL is set"
          else
            echo "API_BASE_URL is EMPTY"
          fi

          if [ -n "$API_TOKEN" ]; then
            echo "API_TOKEN is set"
          else
            echo "API_TOKEN is EMPTY"
          fi

          if [ -n "$USERNAME" ]; then
            echo "USERNAME is set"
          else
            echo "USERNAME is EMPTY"
          fi

          if [ -n "$PASSWORD" ]; then
            echo "PASSWORD is set"
          else
            echo "PASSWORD is EMPTY"
          fi

          if [ -n "$OAUTH_CLIENT_ID" ]; then
            echo "OAUTH_CLIENT_ID is set"
          else
            echo "OAUTH_CLIENT_ID is EMPTY"
          fi

          if [ -n "$OAUTH_CLIENT_SECRET" ]; then
            echo "OAUTH_CLIENT_SECRET is set"
          else
            echo "OAUTH_CLIENT_SECRET is EMPTY"
          fi

        env:
          ENV: ${{ github.event.inputs.environment || 'QA' }}
          BASEURL: ${{ secrets.BASEURL }}
          USERNAME: ${{ secrets.OPENCART_USERNAME }}
          PASSWORD: ${{ secrets.OPENCART_PASSWORD }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}

      - name: Run tests
        run: npx playwright test --project=chromium
        env:
          ENV: ${{ github.event.inputs.environment || 'QA' }}
          BASEURL: ${{ secrets.BASEURL }}
          USERNAME: ${{ secrets.OPENCART_USERNAME }}
          PASSWORD: ${{ secrets.OPENCART_PASSWORD }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          GRANT_TYPE: ${{ secrets.GRANT_TYPE }}

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report-${{ github.run_id }}
          path: reports/html-report/
          retention-days: 30

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.run_id }}
          path: allure-results/
          retention-days: 30

      - name: Upload reportingLabs Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporting-labs-report-${{ github.run_id }}
          path: reporting-labs/
          retention-days: 30